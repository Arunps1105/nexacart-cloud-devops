apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: nexacart
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: 153659548146.dkr.ecr.ap-south-1.amazonaws.com/nexacart-backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: nexacart-db-secret
                  key: POSTGRES_DB

            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: nexacart-db-secret
                  key: POSTGRES_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nexacart-db-secret
                  key: POSTGRES_PASSWORD

            - name: DB_HOST
              value: postgres

            - name: DB_PORT
              value: "5432"

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: nexacart
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP