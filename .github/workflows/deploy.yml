name: NexaCart CI/CD

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 153659548146.dkr.ecr.ap-south-1.amazonaws.com
  EKS_CLUSTER: nexacart-eks

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::153659548146:role/NexaCartGitHubActionsRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend
        run: |
          docker build -t $ECR_REGISTRY/nexacart-backend:${{ github.sha }} ./backend
          docker push $ECR_REGISTRY/nexacart-backend:${{ github.sha }}

      - name: Build and push frontend
        run: |
          docker build -t $ECR_REGISTRY/nexacart-frontend:${{ github.sha }} ./frontend
          docker push $ECR_REGISTRY/nexacart-frontend:${{ github.sha }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $EKS_CLUSTER

      - name: Deploy backend
        run: |
          kubectl -n nexacart set image deployment/backend \
            backend=$ECR_REGISTRY/nexacart-backend:${{ github.sha }}

      - name: Deploy frontend
        run: |
          kubectl -n nexacart set image deployment/frontend \
            frontend=$ECR_REGISTRY/nexacart-frontend:${{ github.sha }}

      - name: Wait for backend
        run: |
          kubectl rollout status deployment/backend -n nexacart --timeout=5m

      - name: Wait for frontend
        run: |
          kubectl rollout status deployment/frontend -n nexacart --timeout=5m

      - name: Verify deployment
        run: |
          kubectl get pods -n nexacart
          kubectl get ingress -n nexacart